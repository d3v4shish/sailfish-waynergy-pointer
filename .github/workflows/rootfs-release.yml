name: Build rootfs release asset

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.1.0
  push:
    tags:
      - 'v*'

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build Bookworm armhf rootfs
        run: |
          mkdir -p release-output
          docker run --rm --platform linux/arm/v7 -v "$PWD:/work" -w /work debian:bookworm sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends debootstrap ca-certificates
            ./release/build-rootfs.sh release-output
          '
      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookworm-armhf-minbase
          path: release-output/
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            release-output/bookworm-armhf-minbase.tar.gz release-output/SHA256SUMS
